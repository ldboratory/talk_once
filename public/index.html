<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talk Once</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --border: #252535;
      --accent: #7c6fff;
      --accent-h: #6a5fe0;
      --text: #e6e6f0;
      --muted: #7777a0;
      --my-bg: #7c6fff;
      --other-bg: #1e1e2e;
      --system-c: #444466;
      --online: #4ade80;
      --err: #f87171;
      --r: 12px;
    }

    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    /* ── Entry ── */
    #entry { width: 100%; max-width: 400px; padding: 24px; }
    .logo { text-align: center; margin-bottom: 36px; }
    .logo h1 { font-size: 30px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
    .logo p { color: var(--muted); font-size: 14px; margin-top: 8px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 28px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; }
    .field input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 15px; outline: none; transition: border-color 0.2s; }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--system-c); }
    .btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; transition: background 0.2s, transform 0.1s; }
    .btn:hover { background: var(--accent-h); }
    .btn:active { transform: scale(0.98); }
    .err-msg { color: var(--err); font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }

    /* ── Chat ── */
    #chat { display: none; flex-direction: column; width: 100%; height: 100dvh; max-width: 680px; }
    .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .room-info h2 { font-size: 16px; font-weight: 700; }
    .room-info small { font-size: 12px; color: var(--muted); }
    .online-badge { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--online); box-shadow: 0 0 6px var(--online); }

    .messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Message ── */
    .msg-wrap { display: flex; flex-direction: column; max-width: 74%; cursor: default; }
    .msg-wrap.mine { align-self: flex-end; align-items: flex-end; }
    .msg-wrap.other { align-self: flex-start; }
    .msg-nick { font-size: 11px; color: var(--muted); margin-bottom: 3px; padding: 0 4px; }
    .msg-row { display: flex; align-items: flex-end; gap: 5px; }
    .mine .msg-row { flex-direction: row-reverse; }

    .bubble { padding: 9px 14px; border-radius: 16px; font-size: 14px; line-height: 1.55; word-break: break-word; }
    .mine .bubble { background: var(--my-bg); color: #fff; border-bottom-right-radius: 4px; }
    .other .bubble { background: var(--other-bg); color: var(--text); border-bottom-left-radius: 4px; }
    .bubble.img-only { padding: 4px; }

    /* 이미지 */
    .chat-img { max-width: 220px; max-height: 220px; border-radius: 10px; display: block; cursor: zoom-in; transition: opacity 0.15s; }
    .chat-img:hover { opacity: 0.88; }
    .chat-img + span { display: block; margin-top: 5px; }

    /* 답글 인용 */
    .reply-quote { border-left: 2px solid rgba(255,255,255,0.35); background: rgba(0,0,0,0.15); border-radius: 4px; padding: 4px 8px; margin-bottom: 6px; }
    .other .reply-quote { border-left-color: var(--accent); background: rgba(124,111,255,0.1); }
    .rq-nick { display: block; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.8); margin-bottom: 1px; }
    .other .rq-nick { color: var(--accent); }
    .rq-text { display: block; font-size: 12px; color: rgba(255,255,255,0.6); }
    .other .rq-text { color: var(--muted); }

    /* 시간 + 읽음 */
    .msg-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 1px; flex-shrink: 0; }
    .mine .msg-meta { align-items: flex-start; }
    .msg-read { font-size: 10px; color: var(--accent); white-space: nowrap; min-height: 13px; }
    .msg-time { font-size: 10px; color: var(--system-c); white-space: nowrap; }

    .sys-msg { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0; }

    /* ── 참여자 패널 ── */
    .members-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 8px; display: flex; align-items: center; gap: 5px; font-size: 13px; transition: color 0.2s, background 0.2s; margin-left: 8px; }
    .members-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .members-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .panel-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; }
    .panel-backdrop.show { display: block; }

    .members-panel { position: fixed; top: 0; right: 0; width: 260px; height: 100%; background: var(--surface); border-left: 1px solid var(--border); z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
    .members-panel.open { transform: translateX(0); }

    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .panel-title { font-size: 15px; font-weight: 700; }
    .panel-count { font-size: 13px; color: var(--muted); margin-left: 6px; }
    .panel-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; border-radius: 6px; transition: color 0.2s; line-height: 1; }
    .panel-close:hover { color: var(--text); }

    .member-list { list-style: none; overflow-y: auto; flex: 1; padding: 10px 0; }
    .member-list::-webkit-scrollbar { width: 4px; }
    .member-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .member-item { display: flex; align-items: center; gap: 12px; padding: 9px 18px; transition: background 0.15s; }
    .member-item:hover { background: rgba(255,255,255,0.04); }

    .member-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; text-transform: uppercase; }
    .member-nick { font-size: 14px; color: var(--text); }
    .me-tag { font-size: 11px; color: var(--accent); font-style: normal; font-weight: 600; margin-left: 5px; background: rgba(124,111,255,0.15); padding: 1px 5px; border-radius: 4px; }

    /* ── 답글 미리보기 바 ── */
    .reply-bar { display: none; align-items: center; gap: 10px; padding: 8px 18px; background: var(--surface); border-top: 1px solid var(--accent); flex-shrink: 0; }
    .reply-bar-inner { flex: 1; min-width: 0; }
    .reply-bar-label { font-size: 11px; color: var(--accent); font-weight: 700; display: block; margin-bottom: 2px; }
    .reply-bar-row { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
    #replyNick { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
    #replyText { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reply-cancel-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px 6px; border-radius: 4px; flex-shrink: 0; transition: color 0.2s; }
    .reply-cancel-btn:hover { color: var(--text); }

    /* ── Footer ── */
    .chat-footer { display: flex; align-items: center; gap: 8px; padding: 12px 18px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }
    .chat-footer input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 24px; padding: 10px 18px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.2s; }
    .chat-footer input:focus { border-color: var(--accent); }
    .chat-footer input::placeholder { color: var(--system-c); }

    /* 이미지 첨부 버튼 */
    .img-btn { width: 38px; height: 38px; background: none; border: 1px solid var(--border); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--muted); transition: border-color 0.2s, color 0.2s, background 0.2s; }
    .img-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,111,255,0.08); }
    .img-btn svg { width: 16px; height: 16px; }

    .send-btn { width: 42px; height: 42px; background: var(--accent); border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s, transform 0.1s; }
    .send-btn:hover { background: var(--accent-h); }
    .send-btn:active { transform: scale(0.92); }
    .send-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* 이미지 라이트박스 */
    #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; align-items: center; justify-content: center; cursor: zoom-out; }
    #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; object-fit: contain; }

    @media (max-width: 480px) {
      #entry { padding: 16px; }
      .card { padding: 22px 16px; }
      .msg-wrap { max-width: 86%; }
      .chat-img { max-width: 180px; max-height: 180px; }
    }
  </style>
</head>
<body>

<!-- 입장 화면 -->
<div id="entry">
  <div class="logo">
    <h1>Talk Once</h1>
    <p>방 코드를 공유하고 실시간으로 대화하세요</p>
  </div>
  <div class="card">
    <div class="field">
      <label>참여 코드</label>
      <input id="roomCode" type="text" placeholder="방 코드를 입력하세요" maxlength="24" autocomplete="off" autofocus>
    </div>
    <div class="field">
      <label>닉네임</label>
      <input id="nickname" type="text" placeholder="사용할 닉네임" maxlength="16" autocomplete="off">
    </div>
    <button class="btn" id="joinBtn">입장하기</button>
    <div class="err-msg" id="errMsg"></div>
  </div>
</div>

<!-- 채팅 화면 -->
<div id="chat">
  <div class="chat-header">
    <div class="room-info">
      <h2 id="roomLabel"></h2>
      <small id="myLabel"></small>
    </div>
    <div class="header-right" style="display:flex;align-items:center;">
      <div class="online-badge">
        <div class="dot"></div>
        <span id="count">1명</span>
      </div>
      <button class="members-btn" id="membersBtn" title="참여자 목록">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        참여자
      </button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <!-- 답글 미리보기 바 -->
  <div class="reply-bar" id="replyBar">
    <div class="reply-bar-inner">
      <span class="reply-bar-label">↩ 답글</span>
      <div class="reply-bar-row">
        <span id="replyNick"></span>
        <span id="replyText"></span>
      </div>
    </div>
    <button class="reply-cancel-btn" id="cancelReplyBtn">✕</button>
  </div>

  <div class="chat-footer">
    <!-- 이미지 첨부 버튼 -->
    <input type="file" id="imgInput" accept="image/*" style="display:none">
    <button class="img-btn" id="imgBtn" title="이미지 전송">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </button>
    <input id="msgInput" type="text" placeholder="메시지를 입력하세요..." maxlength="500" autocomplete="off">
    <button class="send-btn" id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<!-- 참여자 패널 -->
<div class="panel-backdrop" id="panelBackdrop"></div>
<div class="members-panel" id="membersPanel">
  <div class="panel-header">
    <div>
      <span class="panel-title">참여자</span>
      <span class="panel-count" id="panelCount"></span>
    </div>
    <button class="panel-close" id="panelClose">✕</button>
  </div>
  <ul class="member-list" id="memberList"></ul>
</div>

<!-- 이미지 라이트박스 -->
<div id="lightbox">
  <img id="lightboxImg" src="" alt="원본 이미지">
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let me = '';
  let replyTarget = null;
  const pendingReads = new Set();

  const $ = id => document.getElementById(id);

  /* ── 알림 ── */
  function requestNotify() {
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  }
  function notify(title, body) {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    const n = new Notification(title, { body });
    n.onclick = () => { window.focus(); n.close(); };
    setTimeout(() => n.close(), 5000);
  }

  /* ── 입장 ── */
  function join() {
    const code = $('roomCode').value.trim();
    const nick = $('nickname').value.trim();
    if (!code) return showErr('참여 코드를 입력해주세요.');
    if (code.length < 2) return showErr('참여 코드는 2자 이상이어야 합니다.');
    if (!nick) return showErr('닉네임을 입력해주세요.');
    $('joinBtn').disabled = true;
    socket.emit('join', { roomCode: code, nickname: nick });
  }
  function showErr(msg) {
    $('errMsg').textContent = msg;
    setTimeout(() => $('errMsg').textContent = '', 3000);
  }

  /* ── 답글 ── */
  function setReply({ id, nickname, text, imageData }) {
    replyTarget = { id, nickname, text: text || '', isImage: !!imageData };
    $('replyNick').textContent = nickname;
    $('replyText').textContent = imageData && !text ? '📷 이미지' : (text.length > 50 ? text.slice(0, 50) + '…' : text);
    $('replyBar').style.display = 'flex';
    $('msgInput').focus();
  }
  function cancelReply() {
    replyTarget = null;
    $('replyBar').style.display = 'none';
  }

  /* ── 텍스트 전송 ── */
  function send() {
    const text = $('msgInput').value.trim();
    if (!text) return;
    socket.emit('message', { text, replyTo: replyTarget });
    $('msgInput').value = '';
    cancelReply();
  }

  /* ── 이미지 압축 & 전송 ── */
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const MAX = 1200;
          let { width, height } = img;
          if (width > MAX || height > MAX) {
            if (width >= height) { height = Math.round(height * MAX / width); width = MAX; }
            else { width = Math.round(width * MAX / height); height = MAX; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.78));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // 클립보드 붙여넣기로 이미지 전송 (Ctrl+V)
  document.addEventListener('paste', async e => {
    if ($('chat').style.display !== 'flex') return; // 채팅 화면에서만 동작
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) return;
        try {
          $('imgBtn').style.opacity = '0.4';
          const imageData = await compressImage(file);
          socket.emit('message', { text: '', imageData, replyTo: replyTarget });
          cancelReply();
        } catch {
          showErr('이미지 처리 중 오류가 발생했어요.');
        } finally {
          $('imgBtn').style.opacity = '';
        }
        break;
      }
    }
  });

  $('imgBtn').addEventListener('click', () => $('imgInput').click());
  $('imgInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) return showErr('이미지 파일만 전송할 수 있어요.');
    if (file.size > 10 * 1024 * 1024) return showErr('10MB 이하 이미지만 전송 가능해요.');
    try {
      $('imgBtn').style.opacity = '0.4';
      const imageData = await compressImage(file);
      socket.emit('message', { text: '', imageData, replyTo: replyTarget });
      cancelReply();
    } catch {
      showErr('이미지 처리 중 오류가 발생했어요.');
    } finally {
      $('imgBtn').style.opacity = '';
    }
  });

  /* ── 참여자 패널 ── */
  const AVATAR_COLORS = ['#7c6fff','#4ade80','#f87171','#fb923c','#a78bfa','#34d399','#60a5fa','#f472b6','#facc15','#38bdf8'];
  function nickColor(nick) {
    let h = 0;
    for (const c of nick) h = (h * 31 + c.charCodeAt(0)) & 0x7fffffff;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }

  function openPanel() {
    $('membersPanel').classList.add('open');
    $('panelBackdrop').classList.add('show');
  }
  function closePanel() {
    $('membersPanel').classList.remove('open');
    $('panelBackdrop').classList.remove('show');
  }

  function renderMemberList(list) {
    $('count').textContent = list.length + '명';
    $('panelCount').textContent = list.length + '명';
    const ul = $('memberList');
    ul.innerHTML = '';
    // 나를 맨 위로
    const sorted = [...list].sort((a, b) => (b.nick === me) - (a.nick === me));
    sorted.forEach(({ nick }) => {
      const li = document.createElement('li');
      li.className = 'member-item';
      const isMe = nick === me;
      li.innerHTML = `
        <div class="member-avatar" style="background:${nickColor(nick)}">${[...nick][0].toUpperCase()}</div>
        <span class="member-nick">${esc(nick)}${isMe ? '<em class="me-tag">나</em>' : ''}</span>`;
      ul.appendChild(li);
    });
  }

  $('membersBtn').addEventListener('click', openPanel);
  $('panelClose').addEventListener('click', closePanel);
  $('panelBackdrop').addEventListener('click', closePanel);

  /* ── 라이트박스 ── */
  function openLightbox(src) {
    $('lightboxImg').src = src;
    $('lightbox').style.display = 'flex';
  }
  $('lightbox').addEventListener('click', () => { $('lightbox').style.display = 'none'; });

  /* ── 메시지 렌더링 ── */
  function renderMsg({ id, nickname, text, imageData, time, replyTo, readCount }, scrollToEnd = true) {
    const mine = nickname === me;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap ' + (mine ? 'mine' : 'other');
    wrap.dataset.id = id;
    wrap.addEventListener('dblclick', () => setReply({ id, nickname, text, imageData }));

    if (!mine) {
      const nickEl = document.createElement('div');
      nickEl.className = 'msg-nick';
      nickEl.textContent = nickname;
      wrap.appendChild(nickEl);
    }

    const row = document.createElement('div');
    row.className = 'msg-row';

    // 답글 인용 블록
    const quoteHTML = replyTo
      ? `<div class="reply-quote"><span class="rq-nick">${esc(replyTo.nickname)}</span><span class="rq-text">${replyTo.isImage ? '📷 이미지' : esc(replyTo.text.length > 45 ? replyTo.text.slice(0, 45) + '…' : replyTo.text)}</span></div>`
      : '';

    // 이미지
    const imgHTML = imageData
      ? `<img class="chat-img" src="${imageData}" alt="이미지">`
      : '';

    // 텍스트
    const textHTML = text ? `<span>${esc(text)}</span>` : '';

    // 읽음 수 (내 메시지만)
    const cnt = readCount || 1;
    const readHTML = mine
      ? `<span class="msg-read" id="rd-${id}">${cnt > 1 ? '읽음 ' + (cnt - 1) : ''}</span>`
      : '';

    const bubbleClass = !text && imageData ? 'bubble img-only' : 'bubble';

    row.innerHTML = `
      <div class="${bubbleClass}">${quoteHTML}${imgHTML}${textHTML}</div>
      <div class="msg-meta">${readHTML}<span class="msg-time">${time}</span></div>`;

    // 이미지 클릭 → 라이트박스
    if (imageData) {
      row.querySelector('.chat-img').addEventListener('click', () => openLightbox(imageData));
    }

    wrap.appendChild(row);
    $('messages').appendChild(wrap);

    // 읽음 처리
    if (!mine) {
      if (!document.hidden) socket.emit('read', id);
      else pendingReads.add(id);
    }

    if (scrollToEnd) scrollBottom();
  }

  /* ── 이벤트 바인딩 ── */
  $('roomCode').addEventListener('keydown', e => e.key === 'Enter' && $('nickname').focus());
  $('nickname').addEventListener('keydown', e => e.key === 'Enter' && join());
  $('joinBtn').addEventListener('click', join);
  $('msgInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('sendBtn').addEventListener('click', send);
  $('cancelReplyBtn').addEventListener('click', cancelReply);

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && pendingReads.size > 0) {
      pendingReads.forEach(id => socket.emit('read', id));
      pendingReads.clear();
    }
  });

  /* ── 소켓 이벤트 ── */
  socket.on('joined', ({ roomCode, nickname, history }) => {
    me = nickname;
    $('roomLabel').textContent = '# ' + roomCode;
    $('myLabel').textContent = nickname + '으로 입장';
    $('entry').style.display = 'none';
    $('chat').style.display = 'flex';
    history.forEach(msg => renderMsg(msg, false));
    scrollBottom();
    $('msgInput').focus();
    requestNotify();
  });

  socket.on('join-error', msg => { $('joinBtn').disabled = false; showErr(msg); });
  socket.on('message', msg => {
    renderMsg(msg);
    if (msg.nickname !== me) notify(`💬 ${msg.nickname}`, msg.imageData && !msg.text ? '📷 이미지' : msg.text);
  });
  socket.on('system', text => {
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = text;
    $('messages').appendChild(el);
    scrollBottom();
  });
  socket.on('participants', list => renderMemberList(list));
  socket.on('read-update', ({ msgId, readCount }) => {
    const el = document.getElementById('rd-' + msgId);
    if (el) el.textContent = readCount > 1 ? '읽음 ' + (readCount - 1) : '';
  });
  socket.on('disconnect', () => {
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = '서버 연결이 끊겼습니다. 새로고침 해주세요.';
    $('messages').appendChild(el);
  });

  function scrollBottom() { const m = $('messages'); m.scrollTop = m.scrollHeight; }
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
